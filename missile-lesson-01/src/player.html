<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Heebo"; src: url("fonts/Heebo.ttf"); font-weight: 100 900; }
:root {
  --bg: #0c1422; --panel: #142033; --line: #2a3b57; --ink: #eef3fa; --dim: #9fb0c8;
  --amber: #ffb703; --cyan: #4cc9f0; --pink: #ff5d8f; --green: #2fd6a3; --violet: #b99bff; --orange: #ff8c42;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: "Heebo", sans-serif; color: var(--ink); font-size: 44px; line-height: 1.35; }
.stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: radial-gradient(1400px 800px at 70% 20%, #16243c 0%, var(--bg) 70%); }
.hdr { position: absolute; top: 0; left: 0; right: 0; height: 84px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 64px; font-size: 30px; color: var(--dim); }
.hdr b { color: var(--amber); font-weight: 700; }
.prog { position: absolute; top: 84px; left: 64px; right: 64px; height: 4px; background: var(--line); border-radius: 2px; }
.prog i { position: absolute; right: 0; top: 0; bottom: 0; background: var(--amber); border-radius: 2px; }
.content { position: absolute; top: 104px; bottom: 150px; left: 80px; right: 80px; display: flex; flex-direction: column; justify-content: center; }
.content > * { flex: none; }
.content > .mathbadge, .content > .pausebadge { align-self: flex-start; }
.subs { position: absolute; left: 0; right: 0; bottom: 0; height: 138px; background: #060b14; border-top: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; padding: 0 150px; text-align: center;
  font-size: 40px; line-height: 1.3; font-weight: 500; color: #fff; }
.subs span { unicode-bidi: plaintext; }

h1 { font-size: 64px; font-weight: 800; color: var(--amber); line-height: 1.2; margin-bottom: 30px; }
h2 { font-size: 46px; font-weight: 700; color: var(--cyan); }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.chip { display: inline-block; background: var(--amber); color: #1a1200; font-weight: 800; font-size: 40px; padding: 6px 34px; border-radius: 40px; margin-bottom: 40px; }
.big { font-size: 104px; font-weight: 900; line-height: 1.15; }
.q { font-size: 92px; font-weight: 800; line-height: 1.2; max-width: 1500px; }
.sub2 { font-size: 50px; color: var(--dim); margin-top: 24px; }
ul.b { list-style: none; }
ul.b li { position: relative; padding: 12px 56px 12px 0; font-size: 1.045em; }
ul.b li::before { content: ""; position: absolute; right: 6px; top: 34px; width: 22px; height: 22px; border-radius: 6px; background: var(--cyan); }
ul.b li small { display: block; font-size: 36px; color: var(--dim); }
.cols { display: flex; gap: 48px; }
.cols > div { flex: 1; min-width: 0; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: 30px 38px; }
.card h2 { margin-bottom: 12px; }
.card p { font-size: 40px; }
.tag { display: inline-block; font-size: 32px; font-weight: 700; padding: 2px 20px; border-radius: 30px; border: 2px solid currentColor; }
.note { font-size: 34px; color: var(--dim); }
.em { color: var(--amber); font-weight: 700; }
.cy { color: var(--cyan); font-weight: 700; }
.vid, .pic { position: relative; background: #000; border: 3px solid var(--line); overflow: hidden; }
.vid img, .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic { border-radius: 14px; }
.cap { font-size: 30px; color: var(--dim); margin-top: 10px; }

/* math */
.mathbadge { display: inline-block; background: var(--green); color: #022; font-weight: 800; font-size: 34px; padding: 4px 26px; border-radius: 30px; margin-bottom: 14px; }
.math .row { font-size: 46px; padding: 9px 0; display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; }
.eq { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 700; font-size: 52px; color: #fff;
  background: #0a111d; border: 2px solid var(--line); border-radius: 14px; padding: 4px 26px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.eq i { font-style: normal; direction: rtl; unicode-bidi: isolate; display: inline-block; color: var(--cyan); font-weight: 500; font-size: 42px; margin: 0 4px; }
.eq.res { border-color: var(--amber); color: var(--amber); }
.pausebox { display: flex; gap: 60px; align-items: center; }
.pausebox .txt { flex: 1; }
.pausebadge { display: inline-block; background: var(--pink); color: #fff; font-weight: 800; font-size: 54px; padding: 6px 40px; border-radius: 50px; margin-bottom: 30px; }
.pausebox p { font-size: 50px; margin-bottom: 14px; }
.ring { width: 360px; height: 360px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .n { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 170px; font-weight: 900; color: var(--amber); font-variant-numeric: tabular-nums; }
svg text { font-family: "Heebo", sans-serif; fill: var(--ink); }
svg .lab { font-size: 34px; font-weight: 700; }
svg .small { font-size: 26px; fill: var(--dim); font-weight: 400; }
[data-hl] { opacity: calc(0.28 + 0.72 * var(--hl, 0)); }
.hlbox[data-hl] { opacity: 1; box-shadow: 0 0 0 calc(5px * var(--hl, 0)) var(--amber); }
table.t { border-collapse: collapse; width: 100%; font-size: 38px; }
table.t td, table.t th { border-bottom: 2px solid var(--line); padding: 14px 18px; text-align: right; vertical-align: top; }
table.t th { color: var(--cyan); font-size: 34px; }
.credits { font-size: 27px; line-height: 1.32; color: var(--dim); columns: 2; column-gap: 50px; direction: ltr; text-align: left; }
.credits div { break-inside: avoid; margin-bottom: 7px; }
.credits b { color: var(--ink); font-weight: 600; }
ol.qs { padding-right: 60px; font-size: 37px; line-height: 1.3; }
ol.qs li { margin-bottom: 14px; padding-right: 10px; }
ol.qs li::marker { color: var(--amber); font-weight: 800; }
</style>
</head>
<body>
<div class="stage">
  <div class="hdr"><div id="chap"></div><div>מבנה הטיל · שיעור 1</div></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="content" id="content"></div>
  <div class="subs" id="subs"><span id="subtxt"></span></div>
</div>
<script>
let S = null, items = [];
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (p) => 1 - Math.pow(1 - p, 3);
function tOf(spec) {
  const m = /^(\d+)(?:\+([\d.]+))?$/.exec(String(spec).trim());
  if (!m) throw new Error('bad time spec ' + spec);
  const k = +m[1];
  if (k >= S.T.length) throw new Error('seg ' + k + ' out of range in ' + S.id);
  return S.T[k] + (+m[2] || 0) * (S.K ? S.K[k] : 1);
}
function segEnd(k) { if (k >= S.T.length) throw new Error('seg ' + k + ' out of range in ' + S.id); return k + 1 < S.T.length ? S.T[k + 1] : S.dur + 1; }
window.setScene = async function (scene) {
  S = scene; items = [];
  document.getElementById('chap').innerHTML = scene.chapLabel || '';
  document.getElementById('prog').style.width = (scene.progress * 100).toFixed(2) + '%';
  const c = document.getElementById('content');
  c.innerHTML = scene.html;
  document.querySelector('.hdr').style.visibility = scene.bare ? 'hidden' : 'visible';
  document.querySelector('.prog').style.visibility = scene.bare ? 'hidden' : 'visible';
  await document.fonts.ready;
  await Promise.all([...c.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  for (const el of c.querySelectorAll('[data-s]')) {
    items.push({ kind: 'in', el, a: tOf(el.dataset.s), x: el.dataset.x != null ? tOf(el.dataset.x) : null, svg: el instanceof SVGElement });
  }
  for (const el of c.querySelectorAll('[data-hl]')) {
    const ranges = el.dataset.hl.split(',').map(r => { const [a, b] = r.split('-').map(Number); return [S.T[a], segEnd(b == null ? a : b)]; });
    items.push({ kind: 'hl', el, ranges });
  }
  for (const el of c.querySelectorAll('[data-draw]')) {
    const len = el.getTotalLength(); el.style.strokeDasharray = len;
    items.push({ kind: 'draw', el, a: tOf(el.dataset.draw), d: +(el.dataset.dur || 1), len });
  }
  for (const el of c.querySelectorAll('[data-move]')) {
    const path = c.querySelector('#' + el.dataset.move);
    items.push({ kind: 'move', el, path, len: path.getTotalLength(), a: tOf(el.dataset.at), d: +(el.dataset.dur || 3), rot: el.dataset.rot !== '0' });
  }
  for (const el of c.querySelectorAll('[data-count]')) {
    items.push({ kind: 'count', el, a: tOf(el.dataset.count), n: +(el.dataset.n || 10), ring: c.querySelector('[data-ring]') });
  }
  const rects = [...c.querySelectorAll('.vid[data-vid]')].map(el => {
    const r = el.getBoundingClientRect();
    return { id: el.dataset.vid, x: Math.round(r.x) + 3, y: Math.round(r.y) + 3, w: Math.round(r.width) - 6, h: Math.round(r.height) - 6, a: el.dataset.s ? tOf(el.dataset.s) : 0 };
  });
  const cr = c.getBoundingClientRect();
  const over = [...c.querySelectorAll('*')].filter(el => { if (el.closest('svg') && el.tagName !== 'svg') return false; const r = el.getBoundingClientRect(); return r.width && (r.right > cr.right + 2 || r.left < cr.left - 2 || r.bottom > cr.bottom + 2); })
    .map(el => el.tagName + '.' + el.className).slice(0, 5);
  return { rects, over };
};
window.windows = function () {
  const w = [];
  for (const it of items) {
    if (it.kind === 'in') { w.push([it.a, it.a + 0.5]); if (it.x != null) w.push([it.x, it.x + 0.3]); }
    if (it.kind === 'hl') for (const [a, b] of it.ranges) { w.push([a, a + 0.3]); w.push([b - 0.3, b]); }
    if (it.kind === 'draw' || it.kind === 'move') w.push([it.a, it.a + it.d]);
    if (it.kind === 'count') w.push([it.a, it.a + it.n + 0.1]);
  }
  for (const s of S.subs) { w.push([s.a, s.a]); w.push([s.b, s.b]); }
  return w;
};
window.renderAt = function (t) {
  for (const it of items) {
    if (it.kind === 'in') {
      let p = ease(clamp((t - it.a) / 0.5)), o = p;
      if (it.x != null) o *= 1 - clamp((t - it.x) / 0.3);
      it.el.style.opacity = o;
      if (!it.svg) it.el.style.transform = `translateY(${((1 - p) * 26).toFixed(2)}px)`;
    } else if (it.kind === 'hl') {
      let v = 0;
      for (const [a, b] of it.ranges) v = Math.max(v, Math.min(clamp((t - a) / 0.3), clamp((b - t) / 0.3)));
      it.el.style.setProperty('--hl', v.toFixed(3));
    } else if (it.kind === 'draw') {
      it.el.style.strokeDashoffset = it.len * (1 - clamp((t - it.a) / it.d));
      it.el.style.visibility = t < it.a ? 'hidden' : 'visible';
    } else if (it.kind === 'move') {
      const raw = clamp((t - it.a) / it.d), p = raw;
      const pt = it.path.getPointAtLength(p * it.len), p2 = it.path.getPointAtLength(Math.min(it.len, p * it.len + 2)), p1 = it.path.getPointAtLength(Math.max(0, p * it.len - 2));
      const ang = it.rot ? Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI : 0;
      it.el.setAttribute('transform', `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    } else if (it.kind === 'count') {
      const e = t - it.a, left = Math.max(0, Math.min(it.n, it.n - e));
      it.el.textContent = Math.ceil(left - 1e-6);
      if (it.ring) { const L = 2 * Math.PI * 160; it.ring.style.strokeDasharray = L; it.ring.style.strokeDashoffset = L * (1 - left / it.n); }
    }
  }
  const cue = S.subs.find(s => t >= s.a && t < s.b);
  document.getElementById('subtxt').textContent = cue ? cue.text : '';
};
</script>
</body>
</html>
