<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דרך השלום – קליפ אנימציה</title>
<style>
  html,body{margin:0;background:#05060d;color:#e8e6f0;font-family:system-ui,"Noto Sans Hebrew",Arial,sans-serif}
  #wrap{max-width:1280px;margin:0 auto;padding:12px;box-sizing:border-box}
  canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000}
  #bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
  button,label.btn{background:#2a2f55;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  input[type=range]{flex:1;min-width:160px}
  body.render #wrap{padding:0;max-width:none} body.render #bar{display:none} body.render canvas{border-radius:0;width:1280px;height:720px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="bar">
    <button id="play">▶ נגן</button>
    <input id="seek" type="range" min="0" max="232" step="0.1" value="0">
    <span id="time">0:00</span>
    <label class="btn">טען את קובץ השיר<input id="file" type="file" accept="audio/*" hidden></label>
  </div>
</div>
<audio id="audio"></audio>
<script>
"use strict";
/* ===== timeline (seconds). The song runs 3:52. Section times are estimates –
   tune these numbers to the recording if a scene comes in early or late. ===== */
const DUR = 232, BPM = 100;
const T = { intro:0, v1:14, cafe:36, ch1:62, walk:78, inter:96, v2:110, door:124, room:132, ch2:160, ext:196, outro:216 };

const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720, TAU = Math.PI*2;
const cl = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,k)=>a+(b-a)*k;
const seg = (t,a,b)=>cl((t-a)/(b-a));
const ez = k=>k*k*(3-2*k);
const sg = (t,a,b)=>ez(seg(t,a,b));
const rnd = i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const beat = t=>Math.pow(1-((t*BPM/60)%1),3);
const FONT = '"Noto Sans Hebrew","Rubik","Arimo","DejaVu Sans",Arial,sans-serif';

function grad(y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function glow(x,y,r,col,a=1){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.save();g.globalAlpha*=a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
function text(s,x,y,size,col,a=1,weight=700,align='center'){g.save();g.globalAlpha*=a;g.font=`${weight} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';g.direction='rtl';g.fillStyle=col;g.fillText(s,x,y);g.restore()}

/* ---------- backdrop pieces ---------- */
function sky(t,top='#070a24',mid='#1b1445',bot='#5a2a5e'){
  g.fillStyle=grad(0,H,[top,mid,bot]);g.fillRect(0,0,W,H);
  for(let i=0;i<110;i++){const x=rnd(i)*W,y=rnd(i+500)*H*.55,tw=.5+.5*Math.sin(t*1.5+i);
    g.globalAlpha=.25+.6*tw*rnd(i+9);g.fillStyle='#fff';g.fillRect(x,y,1.6,1.6)}
  g.globalAlpha=1;
}
function moon(x,y,r=38){glow(x,y,r*4,'rgba(255,240,200,.35)');g.fillStyle='#fff3cf';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  g.fillStyle='rgba(200,180,140,.35)';[[-.3,-.2,.18],[.25,.3,.13],[.3,-.35,.09]].forEach(([a,b,c])=>{g.beginPath();g.arc(x+a*r,y+b*r,c*r,0,TAU);g.fill()})}
function skyline(t,off,base,scale,col,lit,seed=0){
  const bw=70*scale; let i0=Math.floor(off/bw)-1;
  for(let i=i0;i<i0+W/bw+3;i++){
    const x=i*bw-off, h=(60+rnd(i+seed)*230)*scale, w=bw*(.65+rnd(i+seed+3)*.3);
    g.fillStyle=col;g.fillRect(x,base-h,w,h);
    if(rnd(i+seed+7)>.8){g.beginPath();g.moveTo(x+w/2,base-h-40*scale);g.lineTo(x+w/2-3,base-h);g.lineTo(x+w/2+3,base-h);g.fill()}
    if(lit) for(let r=0;r<h/16-1;r++)for(let c=0;c<w/14-1;c++){
      const k=rnd(i*31+r*7+c*13+seed); if(k>.62){const fl=.6+.4*Math.sin(t*.7+k*40);
        g.globalAlpha=lit*fl*(k>.93?1:.7);g.fillStyle=k>.9?'#9fe3ff':'#ffd98a';g.fillRect(x+6+c*14,base-h+8+r*16,6,8)}}
    g.globalAlpha=1;
  }
}
function towers(x,base,s){ // three plain towers: round, triangular, square
  g.fillStyle='#141236';
  g.fillRect(x,base-330*s,70*s,330*s);
  g.beginPath();g.ellipse(x+130*s,base-360*s,38*s,10*s,0,0,TAU);g.fill();g.fillRect(x+92*s,base-360*s,76*s,360*s);
  g.beginPath();g.moveTo(x+190*s,base);g.lineTo(x+190*s,base-300*s);g.lineTo(x+225*s,base-315*s);g.lineTo(x+260*s,base-300*s);g.lineTo(x+260*s,base);g.fill();
  for(let r=0;r<20;r++)for(let c=0;c<16;c++){const k=rnd(r*17+c*5+3);if(k>.55){g.globalAlpha=.55;g.fillStyle='#ffd98a';const cx=x+6*s+c*16*s;if(cx<x+256*s)g.fillRect(cx,base-290*s+r*14*s,5*s,6*s)}}
  g.globalAlpha=1;
}
function palm(x,y,s,sway){
  g.save();g.translate(x,y);g.scale(s,s);
  g.strokeStyle='#1a1410';g.lineWidth=13;g.lineCap='round';g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(10+sway*20,-120,sway*45,-230);g.stroke();
  g.translate(sway*45,-230);g.strokeStyle='#0f2a1c';g.lineWidth=7;
  for(let i=0;i<9;i++){const a=-Math.PI/2+(i-4)*.42+sway*.35,L=105;
    g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(Math.cos(a)*L*.6,Math.sin(a)*L*.6-25,Math.cos(a)*L+sway*18,Math.sin(a)*L+45);g.stroke()}
  g.restore();
}
function haze(t,amt,col='255,190,150'){ // thick, heavy humidity
  for(let i=0;i<6;i++){g.fillStyle=`rgba(${col},${.035*amt})`;g.beginPath();
    const y=250+i*70;g.moveTo(0,y);for(let x=0;x<=W;x+=40)g.lineTo(x,y+Math.sin(x*.006+t*.25+i)*18);
    g.lineTo(W,H);g.lineTo(0,H);g.fill()}
}
function shimmer(t,x,y,w,h,amt){ // rising heat lines
  g.save();g.strokeStyle='rgba(255,170,110,.5)';g.lineWidth=3;g.lineCap='round';
  for(let i=0;i<9;i++){const px=x+(i+.5)*w/9,ph=((t*.35+rnd(i))%1);g.globalAlpha=amt*Math.sin(ph*Math.PI)*.7;
    g.beginPath();for(let k=0;k<=8;k++){const yy=y-ph*h-k*9;const xx=px+Math.sin(k*.9+t*3+i)*7;k?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke()}
  g.restore();
}
function windStreaks(t,amt,col='200,235,255'){
  g.save();g.lineCap='round';g.lineWidth=2.5;
  for(let i=0;i<16;i++){const ph=(t*.45+rnd(i))%1,y=120+rnd(i+40)*480,x=W+200-ph*(W+500);
    g.strokeStyle=`rgba(${col},${amt*.5*Math.sin(ph*Math.PI)})`;g.beginPath();g.moveTo(x,y);
    g.bezierCurveTo(x+60,y-18,x+120,y+18,x+200,y+Math.sin(t+i)*8);g.stroke()}
  g.restore();
}
function ground(y,col='#15101f'){g.fillStyle=col;g.fillRect(0,y,W,H-y)}
function sign(x,y,s,gl=0){ // street sign
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#3a3d4a';g.fillRect(-5,0,10,230);
  if(gl)glow(0,-10,260,'rgba(90,170,255,.55)',gl);
  g.fillStyle='#f4f6fb';rr(-150,-52,300,92,12);g.fill();
  g.fillStyle='#1556b8';rr(-143,-45,286,78,8);g.fill();
  text('דרך השלום',0,-12,40,'#fff');text('DEREKH HASHALOM',0,20,13,'#cfe0ff',1,600);
  g.restore();
}
function heart(x,y,s,col='#ff4d7d',a=1){g.save();g.globalAlpha*=a;g.translate(x,y);g.scale(s,s);g.fillStyle=col;g.beginPath();
  g.moveTo(0,8);g.bezierCurveTo(-22,-10,-10,-26,0,-12);g.bezierCurveTo(10,-26,22,-10,0,8);g.fill();g.restore()}
function hearts(t,x,y,n,amt,spread=120){for(let i=0;i<n;i++){const ph=(t*.22+rnd(i+70))%1;
  heart(x+(rnd(i+3)-.5)*spread+Math.sin(t*1.5+i)*14,y-ph*260,.6+rnd(i)*.9+.15*beat(t),i%3?'#ff4d7d':'#ff9ab5',amt*Math.sin(ph*Math.PI))}}
function caption(s,t,a,b){const k=Math.min(seg(t,a,a+1),1-seg(t,b-1,b));if(k<=0)return;
  g.save();g.globalAlpha=k*.9;g.fillStyle='rgba(8,8,20,.55)';rr(W-70-g.measureText(s).width*3.2-40,54,340,50,25);
  g.restore();text(s,W-80,80,30,'#fff',k,600,'right')}

/* ---------- characters ---------- */
function person(x,y,s,o){
  const {dir=1,sit=0,walk=0,arm=.3,arm2=.2,woman=0,top='#2f6fd6',skin='#e2a97e',hair='#1c1210',hairSway=0,head=0,smile=0}=o;
  g.save();g.translate(x,y);g.scale(s*dir,s);g.lineCap='round';g.lineJoin='round';
  const hip=-78*(1-sit*.12);
  // legs
  g.strokeStyle=woman?skin:'#22263c';g.lineWidth=woman?11:14;
  if(sit){[[0],[6]].forEach(([d])=>{g.beginPath();g.moveTo(0,hip+6);g.lineTo(40+d,hip+8);g.lineTo(42+d,0);g.stroke()})}
  else{[1,-1].forEach(k=>{const a=Math.sin(walk)*.45*k;g.beginPath();g.moveTo(0,hip);g.lineTo(Math.sin(a)*40,hip+40);g.lineTo(Math.sin(a)*70-(a<0?8:0),0);g.stroke()})}
  // back arm
  g.strokeStyle=skin;g.lineWidth=9;g.beginPath();g.moveTo(-2,hip-62);g.lineTo(-2+Math.sin(arm2)*30,hip-62+Math.cos(arm2)*30);g.lineTo(-2+Math.sin(arm2)*30+Math.sin(arm2+.5)*26,hip-62+Math.cos(arm2)*30+Math.cos(arm2+.5)*26);g.stroke();
  // torso
  g.fillStyle=top;
  if(woman){g.beginPath();g.moveTo(-15,hip-72);g.lineTo(15,hip-72);g.lineTo(19,hip-20);g.lineTo(sit?46:30,hip+(sit?18:42));g.lineTo(-26,hip+(sit?14:42));g.lineTo(-17,hip-20);g.closePath();g.fill()}
  else{rr(-19,hip-74,38,82,12);g.fill()}
  // head + hair
  g.save();g.translate(0,hip-96);g.rotate(head);
  if(woman){g.fillStyle=hair;g.beginPath();g.moveTo(-20,-8);g.quadraticCurveTo(-34-hairSway*26,30,-24-hairSway*40,74);g.lineTo(-4-hairSway*20,64);g.lineTo(-2,0);g.fill()}
  g.fillStyle=skin;g.beginPath();g.arc(0,0,20,0,TAU);g.fill();
  g.fillStyle=hair;g.beginPath();g.arc(0,-3,21,Math.PI*.95,TAU*1.02);g.lineTo(8,-10);g.quadraticCurveTo(-6,-14,-20,2);g.fill();
  g.fillStyle='#1a1010';g.beginPath();g.arc(9,-1,2.2,0,TAU);g.fill();
  g.strokeStyle='#8a3b34';g.lineWidth=2;g.beginPath();g.arc(8,6+2*(1-smile),5+smile*2,.15*Math.PI,(.5+.35*smile)*Math.PI);g.stroke();
  g.restore();
  // front arm (arm = angle from down, forward positive)
  g.strokeStyle=skin;g.lineWidth=9;const ax=2,ay=hip-64,ex=ax+Math.sin(arm)*30,ey=ay+Math.cos(arm)*30,hx=ex+Math.sin(arm+.7)*28,hy=ey+Math.cos(arm+.7)*28;
  g.beginPath();g.moveTo(ax,ay);g.lineTo(ex,ey);g.lineTo(hx,hy);g.stroke();
  g.restore();
  return {hx:x+hx*s*dir,hy:y+hy*s};
}
function chair(x,y,s,dir=1,old=1){g.save();g.translate(x,y);g.scale(s*dir,s);g.strokeStyle=old?'#6b4a2e':'#444';g.lineWidth=6;g.lineCap='round';
  g.beginPath();g.moveTo(-22,0);g.lineTo(-18,-70);g.lineTo(-24,-150);g.moveTo(-18,-70);g.lineTo(28,-70);g.lineTo(30,0);g.moveTo(-22,-120);g.lineTo(-20,-118);g.stroke();
  g.lineWidth=4;g.beginPath();g.moveTo(-23,-140);g.lineTo(-20,-100);g.stroke();g.restore()}
function cafeTable(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#3b2a22';g.fillRect(-4,-92,8,92);g.fillRect(-30,-4,60,6);
  g.fillStyle='#5a4034';g.beginPath();g.ellipse(0,-94,62,10,0,0,TAU);g.fill();g.restore()}
function glass(x,y,s,fill,col='rgba(250,240,170,.85)'){g.save();g.translate(x,y);g.scale(s,s);
  g.strokeStyle='rgba(230,240,255,.85)';g.lineWidth=2;
  if(fill>0){g.fillStyle=col;g.beginPath();const h=26*fill;g.moveTo(-9-2*fill,-22-h);g.lineTo(9+2*fill,-22-h);g.quadraticCurveTo(9,-22,0,-20);g.quadraticCurveTo(-9,-22,-9-2*fill,-22-h);g.fill()}
  g.beginPath();g.moveTo(-12,-50);g.quadraticCurveTo(-13,-22,0,-20);g.quadraticCurveTo(13,-22,12,-50);g.moveTo(0,-20);g.lineTo(0,-2);g.moveTo(-9,0);g.lineTo(9,0);g.stroke();g.restore()}
function bottle(x,y,s,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.fillStyle='#3f6b3a';rr(-9,-56,18,56,5);g.fill();g.fillRect(-4,-82,8,30);
  g.fillStyle='#f3ecd2';g.fillRect(-9,-40,18,20);g.fillStyle='#c9b458';g.fillRect(-4,-84,8,6);g.restore()}
function stringLights(t,x0,x1,y,n,swing=0){g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(x0,y);g.quadraticCurveTo((x0+x1)/2+swing*30,y+50,x1,y);g.stroke();
  for(let i=1;i<n;i++){const k=i/n,x=lerp(x0,x1,k)+swing*30*4*k*(1-k)*.5,yy=y+50*4*k*(1-k)*.5+6;const on=.75+.25*Math.sin(t*2+i)+.3*beat(t);
    glow(x,yy,26,['rgba(255,210,120,.9)','rgba(255,140,160,.9)','rgba(140,220,255,.9)'][i%3],on*.7);g.fillStyle='#fff7dc';g.beginPath();g.arc(x,yy,4,0,TAU);g.fill()}}

/* ---------- scenes ---------- */
function sIntro(t){
  const k=seg(t,T.intro,T.v1);
  sky(t);moon(1020-k*60,150+k*10);
  skyline(t,k*60+200,560,.8,'#191741',.5,50);towers(520-k*40,600,.75);
  skyline(t,k*140,640,1.1,'#0c0a22',.8,0);
  ground(640,'#07060f');
  g.fillStyle='rgba(120,200,255,.12)';g.fillRect(0,652,W,68); // sea hint
  haze(t,1);
  const a=sg(t,2,5)*(1-sg(t,11.5,13.5));
  glow(W/2,300,420,'rgba(255,120,160,.35)',a);
  text('דרך השלום',W/2,290,120+6*beat(t),'#fff',a,800);
  text('קליפ אנימציה',W/2,385,30,'#ffd6e4',a*sg(t,4,6),500);
}
function sStreet(t){ // verse 1 opening: Tel Aviv before midnight, no wind, heavy humidity
  const k=seg(t,T.v1,T.cafe),z=1+k*.25;
  sky(t,'#0a0b26','#261547','#6d2f55');moon(220,130);
  g.save();g.translate(W/2,H*.75);g.scale(z,z);g.translate(-W/2,-H*.75);
  skyline(t,300,580,.8,'#1d1845',.5,90);skyline(t,40,610,.6,'#120f30',.7,20);
  ground(600,'#17121f');g.fillStyle='#231b2c';g.fillRect(0,640,W,80);
  for(let i=0;i<8;i++){g.fillStyle='rgba(255,220,150,.25)';g.fillRect(i*180-k*60,676,90,5)}
  // café far away, lights still on
  const cx=760;g.fillStyle='#2b1d25';g.fillRect(cx-120,470,240,132);g.fillStyle='#ffcf7a';g.globalAlpha=.9;g.fillRect(cx-100,500,90,70);g.fillRect(cx+10,500,90,70);g.globalAlpha=1;
  g.fillStyle='#a8324a';g.beginPath();g.moveTo(cx-135,470);g.lineTo(cx+135,470);g.lineTo(cx+150,496);g.lineTo(cx-150,496);g.fill();
  glow(cx,540,220,'rgba(255,190,110,.5)',.8+.2*beat(t));
  [140,420,1060,1220].forEach((x,i)=>palm(x,640,.9+rnd(i)*.4,Math.sin(t*.25+i)*.015)); // palms stand still
  // street lamps
  [300,930].forEach(x=>{g.fillStyle='#2c2c38';g.fillRect(x-3,420,6,220);g.fillRect(x-3,420,46,5);glow(x+42,432,130,'rgba(255,210,150,.55)');})
  g.restore();
  haze(t,2.2);
  // droplets of humidity hanging in the air
  for(let i=0;i<40;i++){const x=rnd(i+200)*W,y=180+rnd(i+300)*420+Math.sin(t*.4+i)*5;g.fillStyle=`rgba(210,230,255,${.12+.1*Math.sin(t+i)})`;g.beginPath();g.arc(x,y,2+rnd(i)*3,0,TAU);g.fill()}
  caption('תל אביב · לפני חצות',t,T.v1+1,T.v1+9);
}
function cafeSet(t,swing,warm=1){
  sky(t,'#0b0c28','#2a1748','#6a2c52');
  skyline(t,120,470,.7,'#17143a',.6,33);
  g.fillStyle='#2a1c24';g.fillRect(0,170,560,400); // café wall
  g.fillStyle='#ffcf7a';g.globalAlpha=.85*warm;rr(60,250,200,230,8);g.fill();rr(300,250,200,230,8);g.fill();g.globalAlpha=1;
  g.strokeStyle='#2a1c24';g.lineWidth=6;[160,400].forEach(x=>{g.beginPath();g.moveTo(x,250);g.lineTo(x,480);g.stroke()});
  g.fillStyle='#a8324a';g.beginPath();g.moveTo(0,170);g.lineTo(590,170);g.lineTo(640,235);g.lineTo(0,235);g.fill();
  for(let i=0;i<8;i++){g.fillStyle=i%2?'#f1e6d6':'#a8324a';g.beginPath();g.arc(40+i*80,235,40,0,Math.PI);g.fill()}
  text('קפה',300,203,34,'#ffe9c9',.95,700);
  ground(570,'#1c1622');g.fillStyle='#261d2c';for(let i=0;i<14;i++)g.fillRect(i*100-20,570+((i%2)*40),96,36);
  palm(1150,600,1.25,swing*.5+Math.sin(t*.3)*.01);palm(980,585,.8,swing*.4);
  stringLights(t,560,1280,150,12,swing);
  glow(300,400,520,'rgba(255,180,100,.35)',warm);
}
function sCafe(t){ // she sits alone on an old chair; he hesitates; a breeze from the sea; a small glance; "sit"
  const breeze=sg(t,48,50)*(1-sg(t,57,60)),sw=breeze*Math.sin(t*2.2)*.6;
  cafeSet(t,sw);
  const glance=sg(t,53.5,54.5), invite=sg(t,55.5,57);
  // table & woman (faces left, toward him)
  cafeTable(820,640,1.15);glass(800,532,1,.4);
  chair(905,640,1.15,-1);
  person(900,640,1.15,{dir:-1,sit:1,woman:1,top:'#d93a6a',hairSway:-breeze*.8-sw*.3,head:lerp(.25,-.05,glance),arm:lerp(.9,1.5,invite)+invite*Math.sin(t*5)*.15,arm2:.8,smile:glance});
  chair(735,640,1.15,1);
  // man: step forward, step back, then walks in and sits
  const hes=Math.sin((t-T.cafe)*.9)*40*(1-sg(t,56,58));
  const walkIn=sg(t,57,60.5),mx=lerp(330+hes,738,walkIn),sitK=sg(t,60.3,61.5);
  person(mx,640,1.15,{dir:1,sit:sitK>.5?1:0,walk:walkIn<1?t*7*(walkIn>0?1:.35):0,top:'#2f6fd6',arm:.25+.2*Math.sin(t*1.3),arm2:-.2,head:-.05,smile:sitK});
  // thought bubble: come closer or step away?

  palm(250,680,1.2,Math.sin(t*.9)*.1);palm(1090,680,1,Math.sin(t*.9+1)*.1);
  sign(1010,440,.95,.4);
  const a=sg(k,.45,.65);
  g.fillStyle=`rgba(6,6,16,${a*.55})`;g.fillRect(0,0,W,H);
  text('דרך השלום',W/2,300,104,'#fff',a,800);
  heart(W/2,410,2.2+.5*beat(t),'#ff4d7d',a);
}

const SCENES=[[T.intro,sIntro],[T.v1,sStreet],[T.cafe,sCafe],[T.ch1,sChorus1],[T.walk,sWalk],[T.inter,sInter],[T.v2,sStairs],[T.door,sDoor],[T.room,sRoom],[T.ch2,sChorus2],[T.ext,sExt],[T.outro,sOutro]];
function drawAt(t){
  t=cl(t,0,DUR);
  let i=SCENES.length-1;while(i>0&&t<SCENES[i][0])i--;
  const a=SCENES[i][0],b=i+1<SCENES.length?SCENES[i+1][0]:DUR;
  g.save();g.globalAlpha=1;g.clearRect(0,0,W,H);SCENES[i][1](t);g.restore();
  // dip-to-dark between scenes, vignette, start/end fades
  const F=.7,f=Math.max(i>0?1-seg(t,a,a+F):0,i+1<SCENES.length?seg(t,b-F,b):0,1-seg(t,0,1.5),seg(t,DUR-2.5,DUR-.3));
  const v=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,W,H);
  if(f>0){g.fillStyle=`rgba(4,4,12,${f})`;g.fillRect(0,0,W,H)}
}
window.drawAt=drawAt;window.DUR=DUR;

/* ---------- player ---------- */
const $=id=>document.getElementById(id),audio=$('audio');
let playing=false,t0=0,cur=0;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function show(t){cur=t;drawAt(t);$('seek').value=t;$('time').textContent=fmt(t)}
function loop(){if(!playing)return;const t=audio.src?audio.currentTime:(performance.now()-t0)/1000;
  if(t>=DUR){playing=false;$('play').textContent='▶ נגן';show(DUR);return}show(t);requestAnimationFrame(loop)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ עצור':'▶ נגן';
  if(playing){if(cur>=DUR)cur=0;t0=performance.now()-cur*1000;if(audio.src){audio.currentTime=cur;audio.play()}loop()}else audio.pause()};
$('seek').oninput=e=>{const t=+e.target.value;t0=performance.now()-t*1000;if(audio.src)audio.currentTime=t;show(t)};
$('file').onchange=e=>{const f=e.target.files[0];if(f){audio.src=URL.createObjectURL(f);show(0)}};
if(new URLSearchParams(location.search).has('render'))document.body.classList.add('render');
show(+(new URLSearchParams(location.search).get('t')||0));
</script>
